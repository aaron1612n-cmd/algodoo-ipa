<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cannon Ball Loop</title>
<style>
  html, body { margin: 0; padding: 0; background: #05060a; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, groundY;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  groundY = H - 60;
}
window.addEventListener('resize', resize);
resize();

// ---- Stars ----
const stars = [];
for (let i = 0; i < 140; i++) {
  stars.push({ x: Math.random(), y: Math.random() * 0.7, r: Math.random() * 1.4 + 0.3, tw: Math.random() * Math.PI * 2 });
}

// ---- Constants ----
const GRAVITY = 1900;          // px/s^2
const RESTITUTION = 0.55;      // energy kept (velocity) per bounce vertically
const BOUNCE_FRICTION = 0.8;   // horizontal speed kept per bounce
const ROLL_DECEL = 900;        // px/s^2 rolling friction
const BALL_R = 14;
const FIRE_SPEED = 780;
const FIRE_ANGLE = 52 * Math.PI / 180; // above horizontal

// Cannon geometry
const cannonBase = { x: 110, y: groundY };
const barrelLen = 78;
const barrelAngle = -FIRE_ANGLE; // screen space (up is negative y)

function muzzlePoint() {
  return {
    x: cannonBase.x + Math.cos(barrelAngle) * barrelLen,
    y: cannonBase.y + Math.sin(barrelAngle) * barrelLen
  };
}

// ---- Ball state machine ----
let ball = { x: 0, y: 0, vx: 0, vy: 0, rot: 0 };
let state = 'charging'; // charging -> flight -> rolling -> returning -> charging ...
let stateTimer = 0;
let muzzleFlash = 0;
let restPoint = { x: 0, y: 0 };
let returnStart = { x: 0, y: 0 };
let returnElapsed = 0;
const RETURN_DURATION = 0.9; // seconds

function startCharge() {
  state = 'charging';
  stateTimer = 0;
  const m = muzzlePoint();
  ball.x = m.x; ball.y = m.y;
  ball.vx = 0; ball.vy = 0;
}

function fire() {
  const m = muzzlePoint();
  ball.x = m.x; ball.y = m.y;
  ball.vx = Math.cos(barrelAngle) * FIRE_SPEED;
  ball.vy = Math.sin(barrelAngle) * FIRE_SPEED;
  state = 'flight';
  muzzleFlash = 1;
}

startCharge();

function startReturn() {
  state = 'returning';
  returnElapsed = 0;
  returnStart.x = ball.x;
  returnStart.y = ball.y;
}

function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function update(dt) {
  stateTimer += dt;

  if (state === 'charging') {
    if (stateTimer > 0.35) fire();
    return;
  }

  if (state === 'flight') {
    ball.vy += GRAVITY * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.rot += ball.vx * dt / BALL_R;

    if (ball.y + BALL_R >= groundY) {
      ball.y = groundY - BALL_R;
      if (Math.abs(ball.vy) > 60) {
        ball.vy = -ball.vy * RESTITUTION;
        ball.vx *= BOUNCE_FRICTION;
      } else {
        ball.vy = 0;
        state = 'rolling';
      }
    }
    // stop if it somehow flies off the left past the cannon base while descending fast (safety)
    return;
  }

  if (state === 'rolling') {
    const dir = Math.sign(ball.vx) || 0;
    ball.vx -= dir * ROLL_DECEL * dt;
    if (dir !== 0 && Math.sign(ball.vx) !== dir) ball.vx = 0;
    ball.x += ball.vx * dt;
    ball.rot += ball.vx * dt / BALL_R;
    ball.y = groundY - BALL_R;

    if (Math.abs(ball.vx) < 12) {
      ball.vx = 0;
      restPoint.x = ball.x;
      restPoint.y = ball.y;
      startReturn();
    }
    return;
  }

  if (state === 'returning') {
    returnElapsed += dt;
    const m = muzzlePoint();
    let t = Math.min(returnElapsed / RETURN_DURATION, 1);
    const e = easeInOutQuad(t);

    // Arc back to the muzzle: lift above the straight line for a "hop" feel.
    const lift = Math.sin(t * Math.PI) * 90;
    ball.x = returnStart.x + (m.x - returnStart.x) * e;
    ball.y = returnStart.y + (m.y - returnStart.y) * e - lift;
    ball.rot -= 6 * dt;

    if (t >= 1) {
      startCharge();
    }
    return;
  }
}

// ---- Drawing ----
function drawStars(time) {
  ctx.save();
  for (const s of stars) {
    const alpha = 0.35 + 0.35 * Math.sin(time / 900 + s.tw);
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0.15, alpha)})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawGround() {
  ctx.fillStyle = '#12141c';
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.strokeStyle = 'rgba(120,140,200,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
}

function drawCannon() {
  ctx.save();
  // base
  ctx.fillStyle = '#3a3f4d';
  ctx.beginPath();
  ctx.moveTo(cannonBase.x - 40, cannonBase.y + 4);
  ctx.lineTo(cannonBase.x + 40, cannonBase.y + 4);
  ctx.lineTo(cannonBase.x + 26, cannonBase.y - 22);
  ctx.lineTo(cannonBase.x - 26, cannonBase.y - 22);
  ctx.closePath();
  ctx.fill();

  // wheel
  ctx.fillStyle = '#20222b';
  ctx.beginPath();
  ctx.arc(cannonBase.x, cannonBase.y + 6, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#4c5266';
  ctx.lineWidth = 3;
  ctx.stroke();

  // barrel
  ctx.translate(cannonBase.x, cannonBase.y - 14);
  ctx.rotate(barrelAngle);
  const grad = ctx.createLinearGradient(0, -12, 0, 12);
  grad.addColorStop(0, '#565d70');
  grad.addColorStop(0.5, '#2c2f3a');
  grad.addColorStop(1, '#565d70');
  ctx.fillStyle = grad;
  ctx.fillRect(0, -12, barrelLen, 24);
  ctx.fillStyle = '#1b1c22';
  ctx.beginPath();
  ctx.arc(barrelLen, 0, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // muzzle flash
  if (muzzleFlash > 0) {
    const m = muzzlePoint();
    ctx.save();
    ctx.globalAlpha = muzzleFlash;
    const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 40);
    g.addColorStop(0, 'rgba(255,220,140,0.9)');
    g.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    muzzleFlash -= 0.06;
  }

  // charge glow while waiting to fire
  if (state === 'charging') {
    const m = muzzlePoint();
    const pulse = 0.5 + 0.5 * Math.sin(stateTimer * 30);
    ctx.save();
    ctx.globalAlpha = 0.5 * pulse;
    const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 22);
    g.addColorStop(0, 'rgba(120,200,255,0.9)');
    g.addColorStop(1, 'rgba(120,200,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawBall() {
  ctx.save();
  ctx.translate(ball.x, ball.y);

  // glow
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, BALL_R * 3.2);
  g.addColorStop(0, 'rgba(255,180,90,0.55)');
  g.addColorStop(1, 'rgba(255,180,90,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, BALL_R * 3.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(ball.rot);
  const bg = ctx.createRadialGradient(-BALL_R * 0.3, -BALL_R * 0.3, 1, 0, 0, BALL_R);
  bg.addColorStop(0, '#fff3d6');
  bg.addColorStop(0.4, '#ffb648');
  bg.addColorStop(1, '#c85a12');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
  ctx.fill();

  // seam marks so rotation reads visually
  ctx.strokeStyle = 'rgba(60,20,0,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-BALL_R, 0);
  ctx.lineTo(BALL_R, 0);
  ctx.moveTo(0, -BALL_R);
  ctx.lineTo(0, BALL_R);
  ctx.stroke();

  ctx.restore();
}

let lastTime = performance.now();
function loop(now) {
  let dt = (now - lastTime) / 1000;
  dt = Math.min(dt, 1 / 30); // clamp to avoid big jumps
  lastTime = now;

  // trail effect via translucent fill instead of hard clear
  ctx.fillStyle = 'rgba(5,6,10,0.45)';
  ctx.fillRect(0, 0, W, H);

  drawStars(now);
  drawGround();
  update(dt);
  drawCannon();
  drawBall();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
